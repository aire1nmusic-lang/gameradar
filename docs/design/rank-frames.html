<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameScout — аккуратные рамки рейтинга</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f17;color:#e9eef3;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:30px}h1{margin:0;font-size:25px;letter-spacing:-.6px}header p{color:#99a9b8;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.variant{min-width:0}h2{font-size:14px;font-weight:550;margin:0 0 6px}p.hint{font-size:12px;color:#97a5b5;margin:0 0 18px}.list{background:linear-gradient(135deg,#20304040,#12213012);border-radius:14px;padding:8px}.row{display:grid;grid-template-columns:28px 32px minmax(0,1fr) auto;align-items:center;gap:9px;min-height:66px;padding:10px 8px;position:relative}.row img{width:32px;height:32px;border-radius:8px}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600;letter-spacing:-.1px}.meta{color:#a6b4c0;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.number{font-size:12px;display:grid;place-items:center;width:28px;height:28px;color:var(--accent);font-weight:550;font-variant-numeric:tabular-nums}.metric{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}.metric small{display:block;font-size:10px;font-weight:400;color:#a6b4c0;margin-top:3px}.row:nth-child(1){--accent:#d7c194;--stroke:#d7c1945c}.row:nth-child(2){--accent:#c0cdd8;--stroke:#c0cdd847}.row:nth-child(3){--accent:#cea98d;--stroke:#cea98d40}.a .number{border:1px solid var(--stroke);border-radius:8px;background:linear-gradient(135deg,#e7d9b70c,transparent)}.a .row+.row{border-top:1px solid #c0d1e31a}.b .list{padding:0;background:none}.b .row{border:1px solid var(--stroke);border-radius:12px;background:linear-gradient(135deg,#24374755,#13213038);margin-bottom:8px;padding:10px}.b .number{background:none}.c .list{border:1px solid #c0d1e335;padding:0 10px;border-radius:14px}.c .row+.row{border-top:1px solid #c0d1e321}.c .number{border:1px solid var(--stroke);border-radius:6px;width:25px;height:25px}.c .row{padding:10px 0}.light{margin-top:30px;border-radius:18px;padding:24px;background:linear-gradient(130deg,#eef2f5,#dce4e9);color:#22313f}.light>p{margin:0 0 20px;color:#637480;font-size:12px}.light .hint{color:#647583}.light .list{background:#ffffff47}.light .meta,.light .metric small{color:#607381}.light .row:nth-child(1){--accent:#80602b;--stroke:#9d7b464e}.light .row:nth-child(2){--accent:#5b6b79;--stroke:#70828f45}.light .row:nth-child(3){--accent:#925f40;--stroke:#a5725340}.light .a .row+.row,.light .c .row+.row{border-top-color:#64768725}.light .b .list{background:none}.light .b .row{background:#ffffff47}.light .c .list{border-color:#62758135}footer{color:#8496a6;font-size:11px;margin-top:18px}@media(max-width:900px){body{padding:20px}.grid{grid-template-columns:1fr;gap:26px}.variant{max-width:430px;width:100%;margin:auto}.light{padding:18px}h1{font-size:23px}}
</style><header><h1>Рейтинг с тонкими рамками</h1><p>Компактные строки, спокойные оттенки, одинаковый размер серверов.</p></header><main id="dark" class="grid"></main><section class="light"><p>Те же варианты в светлой теме</p><div id="light" class="grid"></div></section><footer>Макет оформления · цифры для сравнения визуала</footer><script>
const variants=[['a','1. Рамка вокруг номера','Строки разделены тонкой линией'],['b','2. Рамка вокруг строки','Самый цельный вариант для каталога'],['c','3. Общая рамка списка','Спокойный вариант для блоков рейтинга']];const servers=[['BoHpts x500','High Five · ×500','4 654'],['TheBattle.Club','High Five · ×10','3 108'],['L2MAD Interlude','Interlude · ×30','2 355']];
for(const id of ['dark','light'])document.getElementById(id).innerHTML=variants.map(([cls,title,hint])=>`<section class="variant ${cls}"><h2>${title}</h2><p class="hint">${hint}</p><div class="list">${servers.map(([name,meta,metric],i)=>`<div class="row"><span class="number">${i+1}</span><img src="../../public/media/ui/lineage2-default-avatar.webp" alt=""><div style="min-width:0"><div class="name">${name}</div><div class="meta">${meta}</div></div><div class="metric">${metric}<small>онлайн</small></div></div>`).join('')}</div></section>`).join('');
</script></html>
