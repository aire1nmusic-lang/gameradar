name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Private core tests
        run: |
          npm run test:private
          node --experimental-strip-types tests/support-projection.mjs
      - name: Public ranking boundary and pagination
        run: node --experimental-strip-types --test tests/public-people-ranking.test.mjs tests/public-people-ranking-runtime.test.mjs tests/public-api-release.test.mjs tests/public-ranking-pagination.test.mjs tests/l2-read-recovery.test.mjs
      # Synthetic data only: real advisory locks, TLS and GPG/pg_restore, no live secrets.
      - name: Disposable real PostgreSQL and encrypted restore
        env:
          PRIVATE_LOCAL_POSTGRES_REHEARSAL: "1"
        run: node scripts/local-postgres-acceptance.mjs
      - name: Gateway, HTTP SEO and primary release safety
        run: node --test tests/yandex-private-gateway.test.mjs tests/seo-http-gate.test.mjs tests/primary-worker-release.test.mjs tests/release-backup.test.mjs tests/release-restore.test.mjs
      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- https://gamescout-public-catalog.aire1n-music.workers.dev/
      - name: Bundle gate
        run: npm run test:bundle
      - name: Current responsive and account recovery browser gate
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/mobile-ux-browser.mjs
      - name: Preserve responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-${{ github.sha }}
          path: output/mobile-ux-qa
          if-no-files-found: warn
          retention-days: 14
