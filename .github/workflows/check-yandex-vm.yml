name: Check Yandex private VM access

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK_VM to run read-only VM checks'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yandex-vm-readonly
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event.inputs.confirm == 'CHECK_VM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require VM SSH settings
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
        run: |
          test -n "$VM_SSH_HOST" || { echo "::error::Missing VM_SSH_HOST"; exit 1; }
          test -n "$VM_SSH_USER" || { echo "::error::Missing VM_SSH_USER"; exit 1; }
          test -n "$VM_SSH_PRIVATE_KEY" || { echo "::error::Missing VM_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VM_DEPLOY_PATH" || { echo "::error::Missing VM_DEPLOY_PATH"; exit 1; }

      - name: Prepare SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_gamescout
          chmod 600 ~/.ssh/id_gamescout
          if [ -n "$VM_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::error::Missing VM_SSH_KNOWN_HOSTS; refusing TOFU for production VM"
            exit 1
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only production VM reality check
        env:
          VM_SSH_HOST: ${{ secrets.VM_SSH_HOST }}
          VM_SSH_USER: ${{ secrets.VM_SSH_USER }}
          VM_DEPLOY_PATH: ${{ secrets.VM_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_gamescout -o BatchMode=yes -o StrictHostKeyChecking=yes "${VM_SSH_USER}@${VM_SSH_HOST}"             "DEPLOY_PATH='${VM_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/deploy/vm/compose.yaml"
          test -f "$DEPLOY_PATH/deploy/vm/.env"
          cd "$DEPLOY_PATH/deploy/vm"
          docker compose version
          docker compose ps
          docker compose exec -T api node -e "fetch('http://127.0.0.1:8080/api/v1/health').then(async r=>{console.log('api-health',r.status);if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
          echo "VM read-only check passed"
          REMOTE
