name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/scripts/cache-public-media*'
      - 'tests/*browser.mjs'
      - 'tests/l2-read-recovery.test.mjs'
      - 'tests/public-catalog-read.test.mjs'
      - 'tests/public-qa-data*'
      - 'tests/browser-qa-runner.test.mjs'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish gamescout.online'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

env:
  YC_BUCKET: gamescout-ru-site
  YC_S3_ENDPOINT: https://storage.yandexcloud.net
  PUBLIC_API_ORIGIN: https://gamescout-public-catalog.aire1n-music.workers.dev/
  PUBLIC_SITE_ORIGIN: https://gamescout.online

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Yandex Object Storage credentials
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          test -n "$YC_ACCESS_KEY_ID" || { echo "::error::Missing YC_ACCESS_KEY_ID"; exit 1; }
          test -n "$YC_SECRET_ACCESS_KEY" || { echo "::error::Missing YC_SECRET_ACCESS_KEY"; exit 1; }

      - name: Check Yandex bucket read access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws --version
          if ! aws s3api list-objects-v2             --bucket "$YC_BUCKET"             --max-keys 1             --endpoint-url "$YC_S3_ENDPOINT"             >/dev/null; then
            echo "::error::Yandex key is valid but has no list/read access to $YC_BUCKET."
            exit 1
          fi
          aws s3api head-object             --bucket "$YC_BUCKET"             --key index.html             --endpoint-url "$YC_S3_ENDPOINT"             >/dev/null

      - run: npm ci

      - name: Private core tests
        run: |
          npm run test:private
          node --experimental-strip-types tests/support-projection.mjs

      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- "${PUBLIC_API_ORIGIN}"

      - name: Disposable real PostgreSQL and encrypted restore
        env:
          PRIVATE_LOCAL_POSTGRES_REHEARSAL: "1"
        run: node scripts/local-postgres-acceptance.mjs

      - name: Stamp production build version
        run: |
          node <<'NODE'
          const {readdir,readFile,writeFile}=require('node:fs/promises')
          const {join}=require('node:path')
          async function walk(dir){
            for(const entry of await readdir(dir,{withFileTypes:true})){
              const path=join(dir,entry.name)
              if(entry.isDirectory()) await walk(path)
              else if(entry.isFile() && entry.name.endsWith('.html')){
                const source=await readFile(path,'utf8')
                if(source.includes('__GS_BUILD__')) await writeFile(path,source.replaceAll('__GS_BUILD__',process.env.GITHUB_SHA))
              }
            }
          }
          ;(async()=>{
            await walk('dist')
          })().catch(error=>{console.error(error);process.exit(1)})
          NODE

      - name: Bundle gate
        run: npm run test:bundle

      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Read recovery, zero support, discovery scoring and runner invariants
        run: |
          node --test tests/l2-read-recovery.test.mjs tests/public-catalog-read.test.mjs tests/public-qa-data.test.mjs tests/browser-qa-runner.test.mjs tests/release-backup.test.mjs tests/release-restore.test.mjs
          node --test tests/yandex-private-gateway.test.mjs tests/seo-http-gate.test.mjs tests/primary-worker-release.test.mjs
          node --experimental-strip-types --test tests/public-people-ranking.test.mjs tests/public-people-ranking-runtime.test.mjs tests/public-ranking-pagination.test.mjs
          node --experimental-strip-types --test tests/zero-support.test.mjs
          node --experimental-strip-types tests/discovery-scoring.mjs

      # The legacy nine-suite runner targets the retired light theme/old layout.
      - name: Current responsive and account recovery browser gate
        run: node tests/mobile-ux-browser.mjs

      - name: Backup current production HTML and service files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/site-rollback"
          aws s3 sync "s3://$YC_BUCKET/" "$RUNNER_TEMP/site-rollback/"             --endpoint-url "$YC_S3_ENDPOINT"             --exclude "assets/*"             --exclude "_deployment-backups/*"             --only-show-errors
          test -f "$RUNNER_TEMP/site-rollback/index.html"

      - name: Persist and verify durable rollback archive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: node scripts/persist-release-backup.mjs

      - name: Snapshot current primary Worker before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-primary-worker.mjs --snapshot

      - name: Preserve primary rollback manifest before activation
        uses: actions/upload-artifact@v4
        with:
          name: primary-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/primary-release/rollback.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload versioned assets first
        id: upload_assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws s3 sync dist/assets/ "s3://$YC_BUCKET/assets/"             --endpoint-url "$YC_S3_ENDPOINT"             --cache-control "public,max-age=31536000,immutable"             --only-show-errors

      - name: Upload HTML and mutable public files without stale caching
        id: upload_html
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws s3 sync dist/ "s3://$YC_BUCKET/"             --endpoint-url "$YC_S3_ENDPOINT"             --exclude "assets/*"             --cache-control "no-cache, no-store, must-revalidate"             --only-show-errors
          # Force index metadata on every deploy even if object heuristics consider it unchanged.
          aws s3 cp dist/index.html "s3://$YC_BUCKET/index.html"             --endpoint-url "$YC_S3_ENDPOINT"             --content-type "text/html; charset=utf-8"             --cache-control "no-cache, no-store, must-revalidate"             --only-show-errors
        # Old hashed assets intentionally stay available for rollback.

      - name: Publish and verify the Worker actually serving the primary domain
        id: publish_primary
        continue-on-error: true # Restore the bucket too, then fail the run below.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          node --test tests/primary-worker-release.test.mjs
          node scripts/publish-primary-worker.mjs

      # Avoid hundreds of metadata requests on an ordinary source-only release.
      - name: Check whether media cache metadata can have changed
        id: media_cache
        if: steps.publish_primary.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises'
          let needed=true
          const before=process.env.BEFORE_SHA,head=process.env.GITHUB_SHA
          if(/^[a-f0-9]{40}$/.test(before||'')&&!/^0+$/.test(before)){
            try{
              const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/compare/'+before+'...'+head,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)})
              if(response.ok){const data=await response.json();if(Array.isArray(data.files)&&data.files.length<300)needed=data.files.some(file=>[file.filename,file.previous_filename||''].some(path=>path.startsWith('public/media/')||path.startsWith('.github/scripts/cache-public-media')))}
            }catch{ /* If comparison is unavailable, retain full maintenance. */ }
          }
          await appendFile(process.env.GITHUB_OUTPUT,`needed=${needed}\n`)
          console.log(needed?'Media cache maintenance needed':'Source-only release: existing media metadata retained')
          NODE

      # Same job/lock: cache maintenance must never replace a pending site release.
      - name: Verify image cache maintenance guards
        if: steps.media_cache.outputs.needed == 'true'
        run: node --test .github/scripts/cache-public-media.test.mjs

      - name: Refresh public image cache metadata after publication
        if: steps.media_cache.outputs.needed == 'true'
        continue-on-error: true # A metadata failure must not undo a verified site release.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: node .github/scripts/cache-public-media.mjs

      - name: Roll back public HTML if verification failed
        if: always() && (steps.publish_primary.outcome == 'failure' || steps.upload_assets.outcome == 'failure' || steps.upload_html.outcome == 'failure')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          echo "::warning::Live verification failed; restoring previous non-asset files"
          node scripts/restore-release-backup.mjs

      - name: Fail workflow after rollback
        if: always() && (steps.publish_primary.outcome == 'failure' || steps.upload_assets.outcome == 'failure' || steps.upload_html.outcome == 'failure')
        run: |
          echo "::error::Production verification failed and rollback was attempted."
          exit 1

      - name: Save release evidence and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/primary-release/rollback.json
            output/mobile-ux-qa
            output/loader-qa
            output/account-review-qa
            output/discovery-qa
            output/aether-qa
            output/l2-review-qa
            output/l2-journey-qa
            output/control-qa
            output/studio-qa
            output/favorites-qa
          retention-days: 14
          if-no-files-found: warn



