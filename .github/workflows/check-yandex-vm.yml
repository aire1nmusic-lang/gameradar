name: Check Yandex private VM access

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CHECK_VM to run read-only VM checks'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yandex-vm-readonly
  cancel-in-progress: true

env:
  VM_SSH_HOST: priv.gamescout.online
  VM_SSH_USER: spl23071994
  VM_DEPLOY_PATH: /home/spl23071994/gamescout-staging

jobs:
  check:
    if: ${{ github.event.inputs.confirm == 'CHECK_VM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require VM SSH secrets
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VM_SSH_PRIVATE_KEY" || { echo "::error::Missing VM_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo "::error::Missing VM_SSH_KNOWN_HOSTS"; exit 1; }

      - name: Prepare SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_gamescout
          chmod 600 ~/.ssh/id_gamescout
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only production VM reality check
        run: |
          ssh -i ~/.ssh/id_gamescout -o BatchMode=yes -o StrictHostKeyChecking=yes "${VM_SSH_USER}@${VM_SSH_HOST}"             "DEPLOY_PATH='${VM_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "host=$(hostname)"
          echo "user=$(id -un)"
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/deploy/vm/compose.yaml"
          test -f "$DEPLOY_PATH/deploy/vm/.env"
          cd "$DEPLOY_PATH/deploy/vm"

          compose() {
            if docker compose version >/dev/null 2>&1; then
              docker compose "$@"
            else
              sudo -n docker compose "$@"
            fi
          }

          compose version
          compose ps
          compose exec -T api node -e "fetch('http://127.0.0.1:8080/api/v1/health').then(async r=>{console.log('api-health',r.status);if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
          echo "VM read-only check passed"
          REMOTE
