name: Discover servers and official openings
# Three bounded runs daily; public facts only, no new cloud resources or private API writes.
on:
  schedule:
    - cron: '23 3,11,19 * * *'   # 06:23, 14:23, 22:23 MSK
  push:
    branches: [main]
    paths:
      - scripts/discovery/**
      - scripts/discover-worlds.mjs
      - scripts/discover-servers.mjs
      - .github/workflows/discover-servers.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: server-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:check
      - name: Verify discovery evidence rules
        run: node --test tests/discovery-facts.test.mjs tests/import-dataset.test.mjs
      - name: Discover GTA and Minecraft; refresh official openings
        run: node scripts/discover-worlds.mjs --write
      - name: Find and confirm Lineage 2 servers
        run: node scripts/discover-servers.mjs --write --pages 3 --limit 12
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: discovery-report
          path: output/discovery/*.json
          retention-days: 7
      - name: Detect dataset change
        id: changed
        run: |
          if git diff --quiet -- import/lineage2.json import/minecraft.json import/gtarp.json; then echo "value=false" >> "$GITHUB_OUTPUT"; else echo "value=true" >> "$GITHUB_OUTPUT"; fi
      - name: Validate the whole dataset
        if: steps.changed.outputs.value == 'true'
        run: npm run import:check
      - name: Upsert confirmed records into the public catalog
        if: steps.changed.outputs.value == 'true' || github.event_name == 'push'
        run: node scripts/import-servers.mjs --remote --games lineage2,minecraft,gtarp --yes
      - name: Commit the dataset
        if: steps.changed.outputs.value == 'true'
        run: |
          git config user.name "gamescout-discovery"
          git config user.email "gamescout-discovery@users.noreply.github.com"
          git add import/lineage2.json import/minecraft.json import/gtarp.json
          git commit -m "Refresh confirmed servers and official opening dates"
          git pull --rebase origin main
          git push origin HEAD:main
