name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Private core tests
        run: |
          npm run test:private
          node --experimental-strip-types tests/support-projection.mjs
      - name: Public ranking boundary and pagination
        run: node --experimental-strip-types --test tests/public-people-ranking.test.mjs tests/public-people-ranking-runtime.test.mjs tests/public-api-release.test.mjs tests/public-ranking-pagination.test.mjs tests/l2-read-recovery.test.mjs
      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- https://gamescout-public-catalog.aire1n-music.workers.dev/
      - name: Bundle gate
        run: npm run test:bundle
