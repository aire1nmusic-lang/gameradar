<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090D" />
    <meta name="gs-build" content="__GS_BUILD__" />
    <title>GameScout — навигатор по игровым серверам</title>
    <meta
      name="description"
      content="GameScout — независимый навигатор по игровым серверам: проверенный онлайн, рейтинги, открытия и рост проектов."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&family=Saira:wdth,wght@112.5,800&family=Noto+Serif:wght@400;600;700&family=Philosopher:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #08090d; }
      body { overflow-x: hidden; }
      html.gs-boot-pending, .gs-boot-pending body, .gs-boot-pending #root { background: #000; }
      .gs-boot-pending #root { visibility: hidden; }
      /* Exact owner-provided gamescout_loader_original_logo(1).html, scoped to boot. */
      .gs-loader, .gs-loader * { box-sizing: border-box; }
      .gs-loader {
        position: fixed; inset: 0; z-index: 9999;
        min-height: 100vh; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden; background: #07090d;
        font-family: Inter, Arial, sans-serif; line-height: normal; color: #fff;
        opacity: 0; visibility: hidden; pointer-events: none;
      }
      .gs-loader-visible .gs-loader { opacity: 1; visibility: visible; pointer-events: auto; }
      .gs-box { text-align: center; }
      .gs-loader-visible .gs-box { animation: gs-show .8s ease; }
      .gs-boot-logo { width: 110px; margin: auto; filter: drop-shadow(0 0 25px rgba(52,230,245,.18)); }
      .gs-boot-logo svg { width: 100%; height: auto; display: inline; vertical-align: baseline; }
      .gs-name { margin-top: 18px; font-size: 48px; font-weight: 800; letter-spacing: .02em; }
      .gs-game { color: #e9edf2; }
      .gs-scout { background: linear-gradient(90deg,#34e6f5,#8b5cf6,#34e6f5); background-size: 200%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gs-shine 5s linear infinite; }
      .gs-status { margin-top: 24px; color: #9aa4b2; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
      .gs-status-dot { animation: gs-blink 1.4s infinite; }
      .gs-status-dot:nth-child(2) { animation-delay: .2s; }
      .gs-status-dot:nth-child(3) { animation-delay: .4s; }
      .gs-firefly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #34e6f5; opacity: .25; animation: gs-float 8s infinite; }
      .gs-firefly.f1 { left: 35%; top: 30%; }
      .gs-firefly.f2 { right: 35%; top: 40%; }
      .gs-firefly.f3 { left: 40%; bottom: 30%; }
      @keyframes gs-show { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; } }
      @keyframes gs-shine { to { background-position: 200%; } }
      @keyframes gs-blink { 50% { opacity: .2; } }
      @keyframes gs-float { 50% { transform: translateY(-20px); opacity: .6; } }
      @media (max-width: 600px) {
        .gs-boot-logo { width: 65px; } .gs-name { font-size: 32px; } .gs-status { font-size: 9px; }
      }
      @media (min-width: 1200px) { .gs-boot-logo { width: 150px; } .gs-name { font-size: 68px; } }
      @media (prefers-reduced-motion: reduce) {
        .gs-loader-visible .gs-box, .gs-scout, .gs-status-dot, .gs-firefly { animation: none; }
      }

      .gs-error {
        position: fixed;
        z-index: 10000;
        left: 20px;
        right: 20px;
        top: calc(50% + 90px);
        text-align: center;
        color: #aab3c2;
        font: 13px Inter, system-ui, sans-serif;
      }
      .gs-error button {
        margin-top: 12px;
        padding: 9px 16px;
        border: 0;
        border-radius: 9px;
        background: #f2f3f7;
        color: #08090d;
        font: 600 13px Inter, system-ui, sans-serif;
      }

    </style>

    <script>
      if (location.pathname === '/') {
        for (const [href, srcset, media] of [
          ['/media/hub/observatory-1920.webp', '/media/hub/observatory-1280.webp 1280w, /media/hub/observatory-1920.webp 1920w, /media/hub/observatory-2000.webp 2000w', '(min-width: 1024px)'],
          ['/media/hub/observatory-m-720.webp', '/media/hub/observatory-m-720.webp 720w, /media/hub/observatory-m-1080.webp 1080w', '(max-width: 1023px)'],
        ]) {
          const preload = document.createElement('link');
          for (const [name, value] of Object.entries({rel:'preload', as:'image', href, imagesrcset:srcset, imagesizes:'100vw', media, fetchpriority:'high'})) preload.setAttribute(name, value);
          document.head.append(preload);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
      <div class="gs-loader" role="status" aria-live="polite" aria-busy="true" aria-label="GameScout загружается">
        <span class="gs-firefly f1"></span><span class="gs-firefly f2"></span><span class="gs-firefly f3"></span>
        <div class="gs-box">
          <div class="gs-boot-logo">
          <svg class="gs-mark" viewBox="284 317.5 729.5 431.5" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="#e9edf2" d="M787.5 321.5 L485 321.5 L288 519 L503 734 L503 611.5 L404 513 L515 402 L707 402 Z M606 486 L473.5 486 L553.5 566 L590 566 L590 582.5 L527 645.5 L527 745 L696 576 Z" />
            <path fill="#34e6f5" d="M990 397.5 L767 397.5 L664 500.5 L750.5 587 L907 587 L859 635 L713.5 635 L625.5 723.5 L879.5 723.5 L1009.5 593.5 L923 507 L766 507 L799.5 473.5 L914 473.5 Z" />
          </svg>
          </div>
          <div class="gs-name"><span class="gs-game">Game</span><span class="gs-scout">Scout</span></div>
          <div class="gs-status">Подготавливаем миры<span class="gs-status-dot">.</span><span class="gs-status-dot">.</span><span class="gs-status-dot">.</span></div>
        </div>
      </div>

    <script>
      (() => {
        const html = document.documentElement;
        html.classList.add("gs-boot-pending");
        document.getElementById("root")?.setAttribute("aria-busy", "true");
        const timer = window.setTimeout(() => {
          if (!document.querySelector(".gs-loader")) return;
          html.classList.add("gs-loader-visible");
          html.dataset.gsLoaderShownAt = String(performance.now());
        }, 1500);
        html.dataset.gsLoaderTimer = String(timer);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
