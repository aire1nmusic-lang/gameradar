<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameScout — варианты хроник</title><style>*{box-sizing:border-box}body{margin:0;background:#111a21;color:#edf2f4;font:14px Arial}header{padding:16px 20px;border-bottom:1px solid #ffffff28;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,a{border:1px solid #ffffff40;color:inherit;background:#ffffff12;text-decoration:none;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;min-height:42px}button.active{background:#c8ff55;color:#18220f}h1{font-size:18px;margin:0 16px 0 0}.sizes{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}#frame-wrap{overflow:auto;padding:14px}iframe{box-sizing:content-box;display:block;margin:auto;border:1px solid #ffffff50;border-radius:12px;background:#15232a;max-width:none}p{margin:10px 20px;color:#bfccd3}</style><header><h1>Раскрытие хроник</h1><button data-v="A" class="active">A · Под поиском</button><a href="GameScout_Chronicles_A_Inline.html" target="_blank">Открыть A ↗</a><button data-v="B" class="">B · Быстрая лента</button><a href="GameScout_Chronicles_B_QuickRail.html" target="_blank">Открыть B ↗</a><button data-v="C" class="">C · Отдельная секция</button><a href="GameScout_Chronicles_C_Section.html" target="_blank">Открыть C ↗</a></header><div class="sizes"><button data-size="320x568">320x568</button><button data-size="390x844">390x844</button><button data-size="768x1024">768x1024</button><button data-size="1024x768">1024x768</button><button data-size="1440x900">1440x900</button><button data-size="844x390">844x390</button></div><p id="note">A — плитки раскрываются под поиском. Выбор закрывает блок и обновляет список.</p><div id="frame-wrap"><iframe title="Интерактивный вариант" src="GameScout_Chronicles_A_Inline.html" width="390" height="844"></iframe></div><script>const f=document.querySelector('iframe');const files={"A": "GameScout_Chronicles_A_Inline.html", "B": "GameScout_Chronicles_B_QuickRail.html", "C": "GameScout_Chronicles_C_Section.html"};const notes={A:'A — плитки раскрываются под поиском. Выбор закрывает блок и обновляет список.',B:'B — популярные хроники всегда видны. Остальные раскрываются дополнительной сеткой.',C:'C — хроники заменяют список серверов внутри страницы. Выбор возвращает к серверам.'};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{f.src=files[b.dataset.v];document.querySelector('#note').textContent=notes[b.dataset.v];document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split('x');f.width=w;f.height=h;document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b))});</script></html>
