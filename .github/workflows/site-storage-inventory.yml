name: Inspect site storage capacity
# Read-only inventory after the 27 October release hit BucketMaxSizeExceeded.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/site-storage-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inventory storage and independently verify three newest complete archives (read only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          import subprocess,json,collections,tempfile,pathlib,hashlib,re
          endpoint='https://storage.yandexcloud.net'
          bucket='gamescout-ru-site'
          def aws(*args):
              result=subprocess.run(['aws',*args,'--endpoint-url',endpoint],capture_output=True,text=True,timeout=180)
              if result.returncode: raise RuntimeError(result.stderr[-600:])
              return result.stdout
          def read(operation,*args):
              return json.loads(aws('s3api',operation,'--bucket',bucket,*args,'--output','json'))
          objects=read('list-objects-v2').get('Contents',[])
          groups=collections.defaultdict(lambda:{'objects':0,'bytes':0})
          backups=[]
          for obj in objects:
              key=obj['Key'];group=key.split('/')[0] if '/' in key else '(root)'
              groups[group]['objects']+=1;groups[group]['bytes']+=obj['Size']
              if re.fullmatch(r'_deployment-backups/[a-f0-9]{40}/[0-9]+-[0-9]+/site-rollback.tar.gz',key):
                  backups.append({'key':key,'bytes':obj['Size'],'modified':obj['LastModified']})
          backups.sort(key=lambda x:(x['modified'],x['key']))
          print('BUCKET_TOTAL',json.dumps({'objects':len(objects),'bytes':sum(x['Size'] for x in objects)}))
          print('PREFIX_TOTALS',json.dumps(dict(groups),sort_keys=True))
          print('DEPLOYMENT_ARCHIVES',json.dumps(backups))
          uploads=read('list-multipart-uploads').get('Uploads',[])
          for upload in uploads:
              parts=read('list-parts','--key',upload['Key'],'--upload-id',upload['UploadId']).get('Parts',[])
              print('INCOMPLETE_MULTIPART',json.dumps({'key':upload['Key'],'uploadId':upload['UploadId'],'initiated':upload['Initiated'],'bytes':sum(x['Size'] for x in parts)}))
          print('INCOMPLETE_MULTIPART_COUNT',len(uploads))
          assert len(backups)>=3,'Need at least three complete control archives'
          with tempfile.TemporaryDirectory() as directory:
              for index,item in enumerate(backups[-3:]):
                  head=read('head-object','--key',item['key'])
                  expected={k.lower():v for k,v in head.get('Metadata',{}).items()}.get('sha256','')
                  assert head['ContentLength']==item['bytes'] and re.fullmatch('[a-f0-9]{64}',expected),'Control archive metadata mismatch'
                  target=pathlib.Path(directory)/str(index)
                  aws('s3','cp','s3://'+bucket+'/'+item['key'],str(target),'--only-show-errors')
                  assert target.stat().st_size==item['bytes'],'Control download size mismatch'
                  digest=hashlib.file_digest(target.open('rb'),'sha256').hexdigest()
                  assert digest==expected,'Control archive checksum mismatch'
                  print('NEWEST_CONTROL_ARCHIVE_VERIFIED',json.dumps({**item,'sha256':digest}))
                  target.unlink()
          print('READ_ONLY_INVENTORY_COMPLETE_NO_DELETIONS')
          PY
