name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/deploy-production.yml'
      - 'tests/loader-browser.mjs'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish gamescout.online'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

env:
  YC_BUCKET: gamescout-ru-site
  YC_S3_ENDPOINT: https://storage.yandexcloud.net
  PUBLIC_API_ORIGIN: https://gamescout.online/
  PUBLIC_SITE_ORIGIN: https://gamescout.online

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Yandex Object Storage credentials
        env:
          YC_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          YC_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
        run: |
          test -n "$YC_ACCESS_KEY_ID" || { echo "::error::Missing YC_ACCESS_KEY_ID"; exit 1; }
          test -n "$YC_SECRET_ACCESS_KEY" || { echo "::error::Missing YC_SECRET_ACCESS_KEY"; exit 1; }

      - name: Check Yandex bucket read access
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws --version
          if ! aws s3api list-objects-v2             --bucket "$YC_BUCKET"             --max-keys 1             --endpoint-url "$YC_S3_ENDPOINT"             >/dev/null; then
            echo "::error::Yandex key is valid but has no list/read access to $YC_BUCKET."
            exit 1
          fi
          aws s3api head-object             --bucket "$YC_BUCKET"             --key index.html             --endpoint-url "$YC_S3_ENDPOINT"             >/dev/null

      - run: npm ci

      - name: Private core tests
        run: npm run test:private
          node --experimental-strip-types tests/support-projection.mjs

      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- "${PUBLIC_API_ORIGIN}"

      - name: Stamp production build version
        run: |
          node <<'NODE'
          const {readdir,readFile,writeFile}=require('node:fs/promises')
          const {join}=require('node:path')
          async function walk(dir){
            for(const entry of await readdir(dir,{withFileTypes:true})){
              const path=join(dir,entry.name)
              if(entry.isDirectory()) await walk(path)
              else if(entry.isFile() && entry.name.endsWith('.html')){
                const source=await readFile(path,'utf8')
                if(source.includes('__GS_BUILD__')) await writeFile(path,source.replaceAll('__GS_BUILD__',process.env.GITHUB_SHA))
              }
            }
          }
          ;(async()=>{
            await walk('dist')
          })().catch(error=>{console.error(error);process.exit(1)})
          NODE

      - name: Bundle gate
        run: npm run test:bundle

      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium

      - name: Public-read recovery and L2 device review before publication
        run: |
          node --test tests/l2-read-recovery.test.mjs tests/public-catalog-read.test.mjs tests/public-qa-data.test.mjs
          node tests/l2-review-browser.mjs

      - name: Aether matrix before publication
        run: |
          node --experimental-strip-types --test tests/zero-support.test.mjs
          node tests/aether-browser.mjs

      - name: L2 utility navigation and zero support before publication
        run: node tests/l2-journey-browser.mjs

      - name: Private favorites across two devices before publication
        run: node tests/favorites-browser.mjs

      - name: Loader matrix before publication
        run: node tests/loader-browser.mjs

      - name: Account matrix before publication
        run: node tests/account-browser.mjs

      - name: Discovery matrix before publication
        run: |
          node --experimental-strip-types tests/discovery-scoring.mjs
          node tests/discovery-browser.mjs

      - name: Visual controls and consistent L2 navigation before publication
        run: node tests/visual-control-browser.mjs

      - name: Support studio before publication
        run: node tests/support-studio-browser.mjs

      - name: Backup current production HTML and service files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/site-rollback"
          aws s3 sync "s3://$YC_BUCKET/" "$RUNNER_TEMP/site-rollback/"             --endpoint-url "$YC_S3_ENDPOINT"             --exclude "assets/*"             --only-show-errors
          test -f "$RUNNER_TEMP/site-rollback/index.html"

      - name: Save rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-site-before-${{ github.sha }}
          path: ${{ runner.temp }}/site-rollback
          retention-days: 14
          if-no-files-found: error

      - name: Upload versioned assets first
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws s3 sync dist/assets/ "s3://$YC_BUCKET/assets/"             --endpoint-url "$YC_S3_ENDPOINT"             --cache-control "public,max-age=31536000,immutable"             --only-show-errors

      - name: Upload HTML and mutable public files without stale caching
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws s3 sync dist/ "s3://$YC_BUCKET/"             --endpoint-url "$YC_S3_ENDPOINT"             --exclude "assets/*"             --cache-control "no-cache, no-store, must-revalidate"             --only-show-errors
          # Force index metadata on every deploy even if object heuristics consider it unchanged.
          aws s3 cp dist/index.html "s3://$YC_BUCKET/index.html"             --endpoint-url "$YC_S3_ENDPOINT"             --content-type "text/html; charset=utf-8"             --cache-control "no-cache, no-store, must-revalidate"             --only-show-errors
        # Old hashed assets intentionally stay available for rollback.

      - name: Verify production freshness, cache policy and SEO
        id: verify_live
        continue-on-error: true
        env:
          SEO_BASE_URL: https://gamescout.online
        run: |
          npm run test:seo
          node <<'NODE'
          const origin='https://gamescout.online'
          const expected=process.env.GITHUB_SHA
          let response,html
          for(let attempt=1;attempt<=6;attempt++){
            response=await fetch(origin+'/',{signal:AbortSignal.timeout(15000)})
            html=await response.text()
            const build=html.match(/<meta name="gs-build" content="([^"]+)"/)?.[1]
            if(response.ok && build===expected) break
            if(attempt===6) throw new Error(`Live HTML is not current build: expected ${expected}, got ${build||'missing'}`)
            await new Promise(r=>setTimeout(r,2000))
          }

          const cacheControl=response.headers.get('cache-control')||''
          if(!/(no-cache|no-store)/i.test(cacheControl)) {
            throw new Error(`HTML cache-control is unsafe: ${cacheControl||'missing'}`)
          }
          const cfStatus=(response.headers.get('cf-cache-status')||'').toUpperCase()
          if(cfStatus==='HIT') throw new Error('Cloudflare served index.html from stale edge cache (CF-Cache-Status: HIT)')


          const refs=[...new Set([...html.matchAll(/(?:src|href)="(\/assets\/[^"]+\.(?:js|css))"/g)].map(m=>m[1]))]
          if(!refs.length) throw new Error('No built JS/CSS asset references found on live home page')
          for(const path of refs){
            const r=await fetch(origin+path,{signal:AbortSignal.timeout(15000)})
            if(!r.ok) throw new Error(`${path}: HTTP ${r.status}`)
            const body=await r.arrayBuffer()
            if(!body.byteLength) throw new Error(`${path}: empty response`)
          }
          console.log(`Production verified: current build, safe cache policy, ${refs.length} assets`)
          NODE
          # The two-device check awaits persisted writes before reloading the second context.
          FAVORITES_QA_BASE_URL=https://gamescout.online node tests/favorites-browser.mjs
          LOADER_BASE_URL=https://gamescout.online node tests/loader-browser.mjs
          ACCOUNT_QA_BASE_URL=https://gamescout.online node tests/account-browser.mjs
          DISCOVERY_QA_BASE_URL=https://gamescout.online node tests/discovery-browser.mjs
          AETHER_QA_BASE_URL=https://gamescout.online node tests/aether-browser.mjs
          L2_JOURNEY_QA_BASE_URL=https://gamescout.online node tests/l2-journey-browser.mjs
          REVIEW_QA_BASE_URL=https://gamescout.online node tests/l2-review-browser.mjs
          CONTROL_QA_BASE_URL=https://gamescout.online node tests/visual-control-browser.mjs
          STUDIO_QA_BASE_URL=https://gamescout.online node tests/support-studio-browser.mjs

      - name: Roll back public HTML if verification failed
        if: steps.verify_live.outcome == 'failure'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          echo "::warning::Live verification failed; restoring previous non-asset files"
          aws s3 sync "$RUNNER_TEMP/site-rollback/" "s3://$YC_BUCKET/"             --endpoint-url "$YC_S3_ENDPOINT"             --cache-control "no-cache, no-store, must-revalidate"             --only-show-errors

      - name: Fail workflow after rollback
        if: steps.verify_live.outcome == 'failure'
        run: |
          echo "::error::Production verification failed and rollback was attempted."
          exit 1

      - name: Save loader QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loader-browser-qa-${{ github.sha }}
          path: |
            output/loader-qa
            output/account-review-qa
            output/discovery-qa
            output/aether-qa
            output/l2-review-qa
            output/l2-journey-qa
            output/control-qa
            output/studio-qa
            output/favorites-qa
          retention-days: 14
          if-no-files-found: ignore


