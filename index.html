<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08090D" />
<title>GameScout — навигатор по игровым серверам</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@112.5,800&display=swap" rel="stylesheet" />
<style>
html,body,#root{margin:0;min-height:100%;background:#08090d}
.gs-loader{height:100vh;display:flex;align-items:center;justify-content:center;background:#08090d;color:#fff;overflow:hidden;font-family:Arial,sans-serif}
.gs-box{display:flex;flex-direction:column;align-items:center;animation:gs-in .8s ease both;position:relative}
.gs-logo{width:72px;filter:drop-shadow(0 0 14px rgba(52,230,245,.18))}
.gs-name{margin-top:14px;font-family:Saira,Arial;font-size:34px;font-weight:800;letter-spacing:.02em}
.gs-game{color:#f8fafc}.gs-scout{color:#34e6f5}
.gs-text{margin-top:24px;color:#98a2b3;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.gs-dot{display:inline-block;animation:dot 1.5s infinite;opacity:.25}.gs-dot:nth-child(2){animation-delay:.2s}.gs-dot:nth-child(3){animation-delay:.4s}
@keyframes dot{50%{opacity:1}}
.fire{position:absolute;width:5px;height:5px;border-radius:50%;background:#34e6f5;opacity:.25;filter:blur(1px);animation:float 8s infinite}
.f1{transform:translate(-90px,-70px)}.f2{transform:translate(90px,-40px);animation-delay:2s}.f3{transform:translate(-110px,60px);animation-delay:4s}.f4{transform:translate(120px,70px);animation-delay:1s}
@keyframes float{50%{opacity:.5;translate:0 -20px}}
@media(min-width:768px){.gs-logo{width:110px}.gs-name{font-size:54px}.gs-text{font-size:13px}}
@media(max-width:767px){.gs-logo{width:58px}.gs-name{font-size:28px}}
</style>
</head>
<body>
<div id="root"><div class="gs-loader" aria-busy="true"><span class="fire f1"></span><span class="fire f2"></span><span class="fire f3"></span><span class="fire f4"></span><div class="gs-box"><svg class="gs-logo" viewBox="284 317.5 729.5 431.5"><path fill="#dfe4ea" d="M787.5 321.5L485 321.5 288 519 503 734 503 611.5 404 513 515 402 707 402Z M606 486 473.5 486 553.5 566 590 566 590 582.5 527 645.5 527 745 696 576Z"/><path fill="#34e6f5" d="M990 397.5 767 397.5 664 500.5 750.5 587 907 587 859 635 713.5 635 625.5 723.5 879.5 723.5 1009.5 593.5 923 507 766 507 799.5 473.5 914 473.5Z"/></svg><div class="gs-name"><span class="gs-game">Game</span><span class="gs-scout">Scout</span></div><div class="gs-text">Подготавливаем миры<span class="gs-dot">.</span><span class="gs-dot">.</span><span class="gs-dot">.</span></div></div></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
