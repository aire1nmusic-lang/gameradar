  /api/v1/sitemap.xml:
    get:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: __FUNCTION_ID__
        service_account_id: __SERVICE_ACCOUNT_ID__
        payload_format_version: '1.0'
  /api/v1/health:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: http
        url: __PRIVATE_ORIGIN__/api/v1/health
        headers:
          '*': '*'
          Host: __PRIVATE_HOST__
          X-GS-Gateway: __PRIVATE_GATEWAY_SECRET__
        query:
          '*': '*'
        omitEmptyHeaders: true
        omitEmptyQueryParameters: true
        timeouts:
          connect: 3
          read: 25
  /api/v1/auth/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: false
          schema:
            type: string
      x-yc-apigateway-integration:
