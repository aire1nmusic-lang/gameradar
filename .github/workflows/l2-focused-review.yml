name: L2 focused visual review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/l2-focused-review.yml', 'tests/l2-journey-browser.mjs', 'src/components/world/lineage-discovery.css', 'src/components/layout/world-glass-review.css', 'src/components/layout/FooterFaq.tsx']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_API_ORIGIN: https://gamescout.online/
      PUBLIC_SITE_ORIGIN: https://gamescout.online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:catalog -- https://gamescout.online
      - name: Browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Read recovery and L2 device review
        run: |
          node --test tests/l2-read-recovery.test.mjs tests/public-catalog-read.test.mjs tests/public-qa-data.test.mjs
          node tests/l2-review-browser.mjs
      - name: Compact screenshot contact sheets for visual review
        run: |
          python -m pip install --quiet Pillow
          python <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import base64, io
          root=Path('output/l2-review-qa')
          groups=[
            ['home-390-dark.png','home-390-light.png','chronicles-390-dark.png','chronicles-390-light.png'],
            ['rating-390-dark.png','rating-390-light.png','filters-390-dark.png','filters-390-light.png'],
            ['support-390-dark.png','support-390-light.png','support-end-390-light.png','faq-390-light.png'],
          ]
          for i,names in enumerate(groups):
            sheet=Image.new('RGB',(1040,730),'#c6c8c7')
            draw=ImageDraw.Draw(sheet)
            for j,name in enumerate(names):
              im=Image.open(root/name).convert('RGB')
              im=im.crop((0,0,im.width,min(im.height,1050)))
              im=ImageOps.contain(im,(260,700))
              sheet.paste(im,(j*260,26));draw.text((j*260+5,7),name,fill='black')
            buffer=io.BytesIO();sheet.save(buffer,'WEBP',quality=84,method=6)
            print('QA_SHEET_'+str(i)+'_BEGIN')
            print(base64.b64encode(buffer.getvalue()).decode())
            print('QA_SHEET_'+str(i)+'_END')
          PY
      - name: Visual controls and support studio
        run: |
          node tests/visual-control-browser.mjs
          node tests/support-studio-browser.mjs
      - name: L2 journey checks
        run: node tests/l2-journey-browser.mjs
      - name: Save small visual review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-focused-review
          retention-days: 14
          path: |
            output/aether-qa/l2-dark-390x844.png
            output/aether-qa/l2-light-390x844.png
            output/aether-qa/l2-dark-768x1024.png
            output/aether-qa/l2-light-1440x900.png
            output/l2-journey-qa/catalog-390-dark.png
            output/l2-journey-qa/account-390-light.png
            output/l2-journey-qa/account-player-390.png
            output/l2-journey-qa/report.json
            output/l2-journey-qa/failure.png
            output/l2-journey-qa/catalog-320-dark.png
            output/l2-review-qa/home-390-dark.png
            output/l2-review-qa/home-390-light.png
            output/l2-review-qa/home-1440-dark.png
            output/l2-review-qa/chronicles-390-dark.png
            output/l2-review-qa/chronicles-390-light.png
            output/l2-review-qa/search-390-dark.png
            output/l2-review-qa/search-390-light.png
            output/l2-review-qa/filters-390-light.png
            output/l2-review-qa/openings-390-dark.png
            output/l2-review-qa/rating-390-light.png
            output/l2-review-qa/support-390-dark.png
            output/l2-review-qa/support-390-light.png
            output/l2-review-qa/faq-390-light.png
            output/l2-review-qa/report.json
            output/l2-review-qa/failure.png
