name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Private core tests
        run: |
          npm run test:private
          node --experimental-strip-types tests/support-projection.mjs
      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- https://gamescout.online/
      - name: Bundle gate
        run: npm run test:bundle
