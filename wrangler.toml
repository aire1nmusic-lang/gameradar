# Existing Cloudflare Pages project remains "gameradar".
name = "gamescout-api"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "gamescout"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

# Safe defaults. Local overrides generated into gitignored .dev.vars.
[vars]
ENVIRONMENT = "production"
DEV_AUTH_ENABLED = "false"
ALLOWED_ORIGIN = "https://gamescout.online"

[observability]
enabled = true
