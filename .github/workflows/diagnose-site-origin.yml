name: Diagnose production origin

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-site-origin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public HTTP and existing Cloudflare routing (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { resolve4, resolveCname } from 'node:dns/promises'
          const site = 'https://gamescout.online'
          for (const suffix of ['/', '/?gs-origin-diagnostic=' + process.env.GITHUB_SHA]) {
            try {
              const r = await fetch(site + suffix, {headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)})
              const body = await r.text()
              console.log('PUBLIC_HTTP', JSON.stringify({path:suffix,status:r.status,headers:Object.fromEntries(['server','cache-control','cf-cache-status','age','etag','via','x-request-id','x-amz-request-id'].map(k=>[k,r.headers.get(k)])),build:body.match(/<meta name="gs-build" content="([^"]+)"/)?.[1],assets:[...body.matchAll(/(?:src|href)="(\/assets\/[^"?]+\.(?:js|css))"/g)].map(m=>m[1])}))
            } catch { console.log('PUBLIC_HTTP_UNAVAILABLE', suffix) }
          }
          console.log('DNS', JSON.stringify({a:await resolve4('gamescout.online').catch(()=>[]),cname:await resolveCname('gamescout.online').catch(()=>[])}))
          if (!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) { console.log('CF_CREDENTIALS_NOT_CONFIGURED'); process.exit(0) }
          async function get(path) {
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(20000)})
            if(!r.ok){console.log('CF_READ_DENIED',path.split('/').filter(Boolean).filter(x=>x!==process.env.CF_ACCOUNT).slice(-1)[0],r.status);return null}
            const j=await r.json();return j.success?j.result:null
          }
          const domains=await get('/accounts/'+process.env.CF_ACCOUNT+'/workers/domains')
          const ownDomains=(domains||[]).filter(d=>d.hostname==='gamescout.online'||d.hostname==='www.gamescout.online')
          console.log('WORKER_DOMAINS',JSON.stringify(ownDomains.map(d=>({hostname:d.hostname,service:d.service,environment:d.environment}))))
          const zones=await get('/zones?name=gamescout.online')
          let routes=[]
          if(zones?.length){routes=await get('/zones/'+zones[0].id+'/workers/routes')||[];console.log('WORKER_ROUTES',JSON.stringify(routes.map(r=>({pattern:r.pattern,script:r.script}))))}
          const scripts=await get('/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts')
          console.log('SITE_SCRIPTS',JSON.stringify((scripts||[]).filter(s=>/gamescout|gameradar/i.test(s.id)).map(s=>({id:s.id,modified_on:s.modified_on}))))
          const names=[...new Set([...ownDomains.map(d=>d.service),...routes.filter(r=>r.pattern?.startsWith('gamescout.online/')&&!r.pattern?.startsWith('gamescout.online/api/')).map(r=>r.script)].filter(Boolean))]
          for(const name of names){
            const settings=await get('/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/'+encodeURIComponent(name)+'/settings')
            if(settings)console.log('SITE_SETTINGS',JSON.stringify({name,bindings:(settings.bindings||[]).map(b=>({name:b.name,type:b.type,...(b.service?{service:b.service}:{}),...(b.environment?{environment:b.environment}:{})})),assets:settings.assets,compatibility_date:settings.compatibility_date}))
          }
          NODE
      - name: Inspect the bound site's Worker code shape (read only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          if (!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) {
            console.log('SITE_WORKER_SOURCE_UNAVAILABLE: credentials not configured')
            process.exit(0)
          }
          const name='gamescout-emergency-preview'
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/'+name,{
            headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(20000)
          })
          if (!response.ok) {console.log('SITE_WORKER_SOURCE_UNAVAILABLE',response.status);process.exit(0)}
          const body=await response.text()
          // Never print the actual source, access tokens, or any environment values.
          console.log('SITE_WORKER_SOURCE_SHAPE',JSON.stringify({
            name,httpStatus:response.status,contentType:response.headers.get('content-type'),bytes:body.length,
            usesAssets: /(?:env|e)\.ASSETS|\bASSETS\.fetch/.test(body),
            usesGameApi: /(?:env|e)\.GAME_API|\bGAME_API\.fetch/.test(body),
            usesYandex: /storage\.yandexcloud|gamescout-ru-site/i.test(body),
            usesPages: /pages\.dev/i.test(body),
            moduleCount:(body.match(/Content-Disposition: form-data/g)||[]).length,
            routesApi:body.includes('/api/'),
            routesIndex:body.includes('index.html'),
            invokesAssetsFetch:body.includes('.ASSETS.fetch('),
            invokesGameApiFetch:body.includes('.GAME_API.fetch('),
            custom404:body.includes('404'),
            importStatements:body.includes('import ')
          }))
          NODE
      - name: Read published Yandex index stamp (read only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws s3 cp s3://gamescout-ru-site/index.html "$RUNNER_TEMP/production-index.html" --endpoint-url https://storage.yandexcloud.net --only-show-errors
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const body=readFileSync(process.env.RUNNER_TEMP+'/production-index.html','utf8')
          console.log('YANDEX_INDEX',JSON.stringify({build:body.match(/<meta name="gs-build" content="([^"]+)"/)?.[1],assets:[...body.matchAll(/(?:src|href)="(\/assets\/[^"?]+\.(?:js|css))"/g)].map(m=>m[1])}))
          NODE
