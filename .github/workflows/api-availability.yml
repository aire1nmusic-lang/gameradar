name: Diagnose live API availability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/api-availability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Anonymous bounded API probes
        run: |
          node --input-type=module <<'NODE'
          const paths=['/api/v1/health','/api/v1/auth/me','/api/v1/games','/api/v1/servers?gameId=lineage2&limit=100','/api/v1/people-rating?gameId=lineage2','/api/v1/support/ranking?gameId=lineage2'];
          await Promise.all(paths.map(async path=>{
            const started=performance.now();
            try {
              const response=await fetch('https://gamescout.online'+path,{signal:AbortSignal.timeout(35000)});
              const body=await response.json().catch(()=>null);
              console.log(JSON.stringify({path,status:response.status,ms:Math.round(performance.now()-started),type:response.headers.get('content-type'),code:body?.error?.code,message:body?.error?.message,items:Array.isArray(body)?body.length:body?.items?.length,total:body?.total,privateCore:path.includes('/auth/')?body?.privateCore:undefined,cache:response.headers.get('cache-control')}));
            } catch(error){console.log(JSON.stringify({path,ms:Math.round(performance.now()-started),error:error.name}));}
          }));
          NODE
      - name: Read-only private service reachability
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$VM_SSH_PRIVATE_KEY" ] || [ -z "$VM_SSH_KNOWN_HOSTS" ]; then echo "VM check BLOCKED: missing existing SSH credentials"; exit 0; fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_gamescout
          chmod 600 ~/.ssh/id_gamescout
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_gamescout -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=8 spl23071994@priv.gamescout.online 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/spl23071994/gamescout-staging/deploy/vm
          compose() { if docker compose version >/dev/null 2>&1; then docker compose "$@"; else sudo -n docker compose "$@"; fi; }
          compose ps
          compose exec -T api node --input-type=module -e "for(const path of ['/api/v1/health','/api/v1/auth/me','/api/v1/people-rating?gameId=lineage2']){const t=performance.now();try{const r=await fetch('http://127.0.0.1:8080'+path,{signal:AbortSignal.timeout(8000)});const b=await r.json().catch(()=>null);console.log(JSON.stringify({path,status:r.status,ms:Math.round(performance.now()-t),code:b?.error?.code,privateCore:b?.privateCore}));}catch(e){console.log(path,e.name)}}"
          REMOTE
