<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#08090D" />
<title>GameScout — навигатор по игровым серверам</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@112.5,800&display=swap" rel="stylesheet" />
<style>
html,body,#root{margin:0;min-height:100%;background:#08090d}
.gs-loader{height:100vh;display:flex;align-items:center;justify-content:center;background:#08090d;color:#fff;overflow:hidden;font-family:Arial,sans-serif}
.gs-box{display:flex;flex-direction:column;align-items:center;position:relative;animation:gsIn .8s cubic-bezier(.2,.8,.2,1)}
@keyframes gsIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.gs-logo{width:56px;filter:drop-shadow(0 0 10px rgba(52,230,245,.15))}
.gs-name{margin-top:12px;font-family:Saira,Arial;font-size:28px;font-weight:800;letter-spacing:.02em}
.gs-game{color:#f8fafc}.gs-scout{background:linear-gradient(90deg,#34e6f5,#8b5cf6,#34e6f5);background-size:220%;animation:shine 5s linear infinite;-webkit-background-clip:text;color:transparent}
@keyframes shine{to{background-position:220%}}
.gs-text{margin-top:22px;color:#98a2b3;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.fire{position:absolute;width:4px;height:4px;border-radius:50%;background:#34e6f5;opacity:.2;filter:blur(1px);animation:fire 9s infinite}
.f1{transform:translate(-95px,-55px)}.f2{transform:translate(90px,-35px);animation-delay:2s}.f3{transform:translate(-80px,60px);animation-delay:4s}.f4{transform:translate(100px,55px);animation-delay:1s}
@keyframes fire{50%{opacity:.45;translate:8px -18px}}
@media(min-width:768px){.gs-logo{width:90px}.gs-name{font-size:44px}.gs-text{font-size:12px}}
@media(min-width:1440px){.gs-logo{width:120px}.gs-name{font-size:60px}}
</style>
</head>
<body>
<div id="root"><div class="gs-loader" aria-busy="true"><span class="fire f1"></span><span class="fire f2"></span><span class="fire f3"></span><span class="fire f4"></span><div class="gs-box"><svg class="gs-logo" viewBox="284 317.5 729.5 431.5"><path fill="#dfe4ea" d="M787.5 321.5L485 321.5 288 519 503 734 503 611.5 404 513 515 402 707 402Z M606 486 473.5 486 553.5 566 590 566 590 582.5 527 645.5 527 745 696 576Z"/><path fill="#34e6f5" d="M990 397.5L767 397.5 664 500.5 750.5 587 907 587 859 635 713.5 635 625.5 723.5 879.5 723.5 1009.5 593.5 923 507 766 507 799.5 473.5 914 473.5Z"/></svg><div class="gs-name"><span class="gs-game">Game</span><span class="gs-scout">Scout</span></div><div class="gs-text">Подготавливаем миры...</div></div></div></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
