# Staging upstream for new.gamescout.online: the candidate build's Worker code
# against the production D1, reachable only through the staging relay
# (PROXY_ONLY + PROXY_SECRET). Same shape as wrangler.origin.toml.
#
# No cron, no queues and no routes: monitoring stays in "gamescout-api", and
# this Worker never answers on gamescout.online. It applies no migrations.
#
#   npx wrangler deploy --config ru-proxy/wrangler.staging.toml
#   npx wrangler secret put PROXY_SECRET --config ru-proxy/wrangler.staging.toml
name = "gamescout-origin-staging"
keep_vars = true
main = "../worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "gamescout"
database_id = "28f90736-92b9-4261-82f5-ed5d8f55f239"
migrations_dir = "../migrations"

[vars]
ENVIRONMENT = "production"
DEV_AUTH_ENABLED = "false"
PUBLIC_ONLY = "true"
ALLOWED_ORIGIN = "https://gamescout.online"
# The staging front's public origins (comma-separated, https only).
EXTRA_ORIGINS = "https://new.gamescout.online,https://d5d08arkk9drmr85tso5.8wihnuyr.apigw.yandexcloud.net"
PROXY_ONLY = "true"

[observability]
enabled = true
