name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose public API network (read-only)
        run: |
          node --input-type=module <<'NODE'
          import { lookup, resolve4, resolve6 } from 'node:dns/promises'
          const host = 'gamescout.online'
          for (const [label, fn] of [['dns-lookup', () => lookup(host, { all: true })], ['dns-A', () => resolve4(host)], ['dns-AAAA', () => resolve6(host)]]) {
            try { console.log(label, JSON.stringify(await fn())) }
            catch (e) { console.log(label, 'FAIL', e.code, e.message) }
          }
          const url = 'https://gamescout.online/api/v1/servers?limit=1&offset=0'
          try {
            const r = await fetch(url, { signal: AbortSignal.timeout(14000), headers: { Accept: 'application/json' } })
            const body = await r.text()
            console.log('fetch', JSON.stringify({ status: r.status, bytes: body.length, contentType: r.headers.get('content-type') }))
          } catch (e) { console.log('fetch FAIL', JSON.stringify({ name:e.name, message:e.message, cause:e.cause && { code:e.cause.code, errno:e.cause.errno, syscall:e.cause.syscall, address:e.cause.address, errors:e.cause.errors?.map(v=>({code:v.code,address:v.address})) } })) }
          NODE
          curl -4 --silent --show-error --location --output /dev/null --write-out 'curl-v4 status=%{http_code} peer=%{remote_ip} tls=%{ssl_verify_result} time=%{time_total}\\n' --connect-timeout 5 --max-time 12 'https://gamescout.online/api/v1/servers?limit=1&offset=0' || true
          curl -6 --silent --show-error --location --output /dev/null --write-out 'curl-v6 status=%{http_code} peer=%{remote_ip} time=%{time_total}\\n' --connect-timeout 5 --max-time 12 'https://gamescout.online/api/v1/servers?limit=1&offset=0' || true
      - name: Private core tests
        run: |
          npm run test:private
          node --experimental-strip-types tests/support-projection.mjs
      - name: Build from live public catalog and verify SEO
        run: npm run build:catalog -- https://gamescout.online/
      - name: Bundle gate
        run: npm run test:bundle

  cf-direct-origin-probe:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'design/l2-elf-sunset-20261011' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe authoritative Cloudflare Worker public endpoint
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          if (!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) {
            console.log('Cloudflare probe BLOCKED: existing token/account secret missing')
            process.exitCode=1
          } else {
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT)+'/workers/subdomain',{
              headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(15000)
            })
            const json=await response.json().catch(()=>null)
            console.log('Cloudflare subdomain discovery HTTP',response.status,'success',json?.success,'errors',JSON.stringify(json?.errors?.map(e=>({code:e.code,message:e.message}))))
            // Check whether workers.dev was intentionally disabled and whether D1 remote read is available.
            const requests=[
              ['script-subdomain','https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT)+'/workers/scripts/gamescout-api/subdomain'],
              ['public-D1-metadata','https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT)+'/d1/database/28f90736-92b9-4261-82f5-ed5d8f55f239']
            ]
            for(const [label,url] of requests){
              try{
                const r=await fetch(url,{signal:AbortSignal.timeout(10000),headers:{Authorization:'Bearer '+process.env.CF_TOKEN}})
                const j=await r.json().catch(()=>null)
                console.log(label,JSON.stringify({status:r.status,success:j?.success,enabled:j?.result?.enabled,hasResult:!!j?.result,errorCodes:j?.errors?.map(e=>e.code)}))
              }catch(e){console.log(label,'FAIL',e.name,e.cause?.code)}
            }
            try{
              const q=await fetch('https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT)+'/d1/database/28f90736-92b9-4261-82f5-ed5d8f55f239/query',{
                method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},
                body:JSON.stringify({sql:"SELECT COUNT(*) AS total FROM servers WHERE moderation='PUBLISHED' AND is_demo=0"}),
                signal:AbortSignal.timeout(12000)
              })
              const j=await q.json().catch(()=>null)
              console.log('public-D1-query',JSON.stringify({status:q.status,success:j?.success,querySuccess:j?.result?.[0]?.success,count:j?.result?.[0]?.results?.[0]?.total,errorCodes:j?.errors?.map(e=>e.code)}))
            }catch(e){console.log('public-D1-query FAIL',e.name,e.cause?.code)}
            const subdomain=json?.result?.subdomain
            if (response.ok && typeof subdomain === 'string' && /^[a-z0-9-]+$/.test(subdomain)) {
              const url='https://gamescout-api.'+subdomain+'.workers.dev/api/v1/servers?limit=100&offset=0'
              try{
                const r=await fetch(url,{signal:AbortSignal.timeout(15000),headers:{Accept:'application/json'}})
                const body=await r.json().catch(()=>null)
                console.log('Cloudflare Worker direct',JSON.stringify({url:new URL(url).origin,status:r.status,items:body?.items?.length,total:body?.total,limit:body?.limit,offset:body?.offset}))
                if (!r.ok || !Array.isArray(body?.items) || body?.limit!==100 || body?.offset!==0)process.exitCode=1
              }catch(e){console.log('Worker direct FAIL',e.name,e.message,e.cause?.code);process.exitCode=1}
            }else{
              console.log('Cloudflare subdomain unavailable; cannot assume workers.dev endpoint exists')
              process.exitCode=1
            }
          }
          NODE
