# Temporary static preview, no custom domain or production DNS binding.
name = "gamescout-emergency-preview"
main = "workers/emergency-preview.mjs"
compatibility_date = "2026-10-10"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[services]]
binding = "GAME_API"
service = "gamescout-api"
