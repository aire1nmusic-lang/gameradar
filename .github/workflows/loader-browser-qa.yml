name: Loader browser QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/loader-browser.mjs'
      - '.github/workflows/loader-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: loader-browser-qa
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:catalog -- https://gamescout.online/
      - run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: node tests/loader-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: loader-qa-diagnostic
          path: output/loader-qa
          retention-days: 7
          if-no-files-found: ignore
