name: Discover new Lineage 2 servers
# Three times a day: read public monitoring lists, confirm each new project on its own website,
# add confirmed records to import/lineage2.json and upsert them into the public catalog (D1).
on:
  schedule:
    - cron: '23 3,11,19 * * *'   # 06:23, 14:23, 22:23 MSK
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: server-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:check
      - name: Find and confirm new servers
        run: node scripts/discover-servers.mjs --write --pages 3 --limit 12
      - name: Keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: discovery-report
          path: output/discovery/last-run.json
          retention-days: 7
      - name: Detect dataset change
        id: changed
        run: |
          if git diff --quiet -- import/lineage2.json; then echo "value=false" >> "$GITHUB_OUTPUT"; else echo "value=true" >> "$GITHUB_OUTPUT"; fi
      - name: Validate the whole dataset
        if: steps.changed.outputs.value == 'true'
        run: npm run import:check
      - name: Upsert Lineage 2 records into the public catalog
        if: steps.changed.outputs.value == 'true'
        run: node scripts/import-servers.mjs --remote --games lineage2 --yes
      - name: Commit the dataset
        if: steps.changed.outputs.value == 'true'
        run: |
          git config user.name "gamescout-discovery"
          git config user.email "gamescout-discovery@users.noreply.github.com"
          git add import/lineage2.json
          git commit -m "Add newly discovered Lineage 2 servers"
          git pull --rebase origin main
          git push origin HEAD:main
