<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#6b4208"/><stop offset=".18" stop-color="#c88a1e"/><stop offset=".42" stop-color="#ffe08a"/>
      <stop offset=".62" stop-color="#d99a2b"/><stop offset="1" stop-color="#5a3605"/>
    </linearGradient>
    <radialGradient id="face" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#fff6c8"/><stop offset=".35" stop-color="#ffd257"/><stop offset=".75" stop-color="#d08b16"/><stop offset="1" stop-color="#8a5508"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#9a6110"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".55"/></filter>
    <g id="coin">
      <path d="M0 0v5a13 4.6 0 0 0 26 0V0" fill="url(#side)"/>
      <path d="M0 1.7a13 4.6 0 0 0 26 0M0 3.4a13 4.6 0 0 0 26 0" fill="none" stroke="#7a4a08" stroke-opacity=".55" stroke-width=".5"/>
      <ellipse cx="13" cy="0" rx="13" ry="4.6" fill="url(#face)" stroke="url(#rim)" stroke-width=".9"/>
      <ellipse cx="13" cy="0" rx="9" ry="3.1" fill="none" stroke="#a8680c" stroke-opacity=".7" stroke-width=".7"/>
      <path d="M7 -1.6Q13 -3.6 19 -1.6" fill="none" stroke="#fffbe0" stroke-opacity=".9" stroke-width=".9" stroke-linecap="round"/>
    </g>
  </defs>
  <g filter="url(#sh)">
    <!-- back stack -->
    <g transform="translate(30 20)"><use href="#coin" y="25"/><use href="#coin" y="20"/><use href="#coin" y="15"/><use href="#coin" y="10"/><use href="#coin" y="5"/><use href="#coin" y="0"/></g>
    <!-- front stack -->
    <g transform="translate(8 33)"><use href="#coin" y="20"/><use href="#coin" y="15"/><use href="#coin" y="10"/><use href="#coin" y="5"/><use href="#coin" y="0"/></g>
    <!-- loose coin leaning in front -->
    <g transform="translate(26 54) rotate(-8)"><use href="#coin"/></g>
  </g>
</svg>
