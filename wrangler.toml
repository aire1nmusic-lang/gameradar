# Existing Cloudflare Pages project remains "gameradar".
name = "gamescout-api"
keep_vars = true
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "gamescout"
database_id = "28f90736-92b9-4261-82f5-ed5d8f55f239"
migrations_dir = "migrations"

# Safe defaults. Local overrides generated into gitignored .dev.vars.
[vars]
ENVIRONMENT = "production"
DEV_AUTH_ENABLED = "false"
PUBLIC_ONLY = "true"
# Free-plan accounts (worker/accounts-free.ts). Needs secrets PASSWORD_PEPPER and ACCOUNTS_RATE_KEY, else answers 503.
# Owner decision 28.10.2026: sign-up open. Without a mail provider only Yandex/Google/Discord sign-up works.
ACCOUNTS_FREE = "true"
ACCOUNTS_REGISTRATION_OPEN = "true"
ALLOWED_ORIGIN = "https://gamescout.online"
# Probes per cron tick; each costs a few subrequests (DNS + connect).
MONITOR_BATCH = "8"

# Monitoring pass: oldest-checked cards first, MONITOR_BATCH per tick. Every 2 min x 8 keeps
# ~50 cards inside the 30-min freshness window and each tick under 50 subrequests.
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# Free-plan cron invocations get 10 ms of CPU, less than one monitoring pass:
# the cron only enqueues a tick, the queue consumer runs the pass. One message
# per tick = 3 queue operations; 720 ticks/day ≈ 2 160 of the 10 000 free ops.
[[queues.producers]]
binding = "MONITOR_QUEUE"
queue = "gamescout-monitor"

[[queues.consumers]]
queue = "gamescout-monitor"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0
max_concurrency = 1

[[routes]]
pattern = "gamescout.online/api/*"
zone_name = "gamescout.online"
